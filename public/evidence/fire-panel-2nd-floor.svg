<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Illustration of a fire alarm control panel with an active alarm indicator">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1c17"/>
      <stop offset="1" stop-color="#122720"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ede9"/>
      <stop offset="1" stop-color="#cbd6d0"/>
    </linearGradient>
    <radialGradient id="alarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a8a"/>
      <stop offset="0.6" stop-color="#e5484d"/>
      <stop offset="1" stop-color="#a11f24"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg3)"/>

  <!-- wall -->
  <rect x="0" y="0" width="1200" height="800" fill="#102019"/>
  <g stroke="#1b3a2f" stroke-width="2" opacity="0.5">
    <path d="M0 640 L1200 640"/>
    <path d="M0 200 L1200 200"/>
  </g>

  <!-- panel body -->
  <rect x="330" y="170" width="540" height="470" rx="16" fill="url(#panel)" stroke="#8fa39a" stroke-width="3"/>
  <rect x="352" y="192" width="496" height="426" rx="10" fill="#f4f8f6" stroke="#c3cec8"/>

  <!-- header strip -->
  <rect x="352" y="192" width="496" height="70" rx="10" fill="#12302a"/>
  <text x="384" y="237" fill="#e8f3ec" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="1">FIRE ALARM PANEL</text>

  <!-- alarm indicator -->
  <circle cx="600" cy="380" r="74" fill="url(#alarm)" stroke="#7d1a1e" stroke-width="4"/>
  <circle cx="600" cy="380" r="74" fill="none" stroke="#ffd0d0" stroke-width="2" opacity="0.6"/>
  <text x="600" y="392" text-anchor="middle" fill="#fff5f5" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">ALARM</text>

  <!-- indicator lights -->
  <g>
    <circle cx="452" cy="520" r="16" fill="#e5484d"/><text x="452" y="560" text-anchor="middle" fill="#12302a" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">FIRE</text>
    <circle cx="540" cy="520" r="16" fill="#a8b6b0" opacity="0.55"/><text x="540" y="560" text-anchor="middle" fill="#12302a" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">FAULT</text>
    <circle cx="628" cy="520" r="16" fill="#a8b6b0" opacity="0.55"/><text x="628" y="560" text-anchor="middle" fill="#12302a" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">POWER</text>
    <circle cx="716" cy="520" r="16" fill="#a8b6b0" opacity="0.55"/><text x="716" y="560" text-anchor="middle" fill="#12302a" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">SILENCE</text>
  </g>

  <!-- speaker grill -->
  <g fill="#12302a" opacity="0.7">
    <rect x="804" y="300" width="24" height="8" rx="3"/>
    <rect x="804" y="320" width="24" height="8" rx="3"/>
    <rect x="804" y="340" width="24" height="8" rx="3"/>
    <rect x="804" y="360" width="24" height="8" rx="3"/>
    <rect x="804" y="380" width="24" height="8" rx="3"/>
  </g>

  <!-- caption -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="60" y="700" width="420" height="52" rx="10" fill="#0b1712" opacity="0.72"/>
    <text x="86" y="734" fill="#e8f3ec" font-size="22" font-weight="600" letter-spacing="1">FIRE PANEL — 2ND FLOOR</text>
  </g>
</svg>
